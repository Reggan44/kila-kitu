<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0B0F19"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#F59E0B" stroke-width="8" stroke-opacity="0.3"/>
  <!-- Glowing gradient background -->
  <circle cx="256" cy="256" r="160" fill="#F59E0B" fill-opacity="0.12"/>
  <!-- Center Emblem -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#goldGradient)"/>
  <rect x="116" y="116" width="280" height="280" rx="56" fill="#0B0F19"/>
  <!-- KK Monogram -->
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="-6">KK</text>
  <defs>
    <linearGradient id="goldGradient" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>
</svg>

